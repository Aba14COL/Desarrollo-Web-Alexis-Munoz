<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FITPLAN - Gestiona y revisa tu progreso de entrenamientos.">
    <title>FITPLAN - Mi Progreso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="contenedor header-inner">
            <a class="logo" href="index.html" aria-label="FitPlan, inicio">Fit<span>Plan</span></a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu"
                aria-label="Abrir o cerrar el menú"><span></span></button>
            <nav id="menu" aria-label="Principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="rutinas.html">Rutinas</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li data-solo-sesion><a href="progreso.html" aria-current="page">Mi progreso</a></li>
                </ul>
            </nav>
            <div id="zona-sesion" class="zona-sesion">
                <a class="btn btn-borde btn-sm" href="login.html">Iniciar sesión</a>
                <a class="btn btn-primario btn-sm" href="registro.html">Únete</a>
            </div>
        </div>
    </header>

    <main>
        <section class="seccion">
            <div class="contenedor dos-columnas">
                <aside class="panel">
                    <h2 class="titulo-seccion">Registrar entrenamiento</h2>
                    <form id="registro-form" class="formulario" action="#" method="post">
                        <div class="campo">
                            <label for="rutina">Rutina realizada</label>
                            <select id="rutina" name="rutina" required>
                                <option value="">Selecciona una rutina</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="fecha">Fecha</label>
                            <input type="date" id="fecha" name="fecha" required>
                        </div>
                        <div class="campo">
                            <label for="duracion">Duración (minutos)</label>
                            <input type="number" id="duracion" name="duracion" min="1" placeholder="Ej. 30" required>
                        </div>
                        <div class="campo">
                            <label for="nota">Nota (opcional)</label>
                            <textarea id="nota" name="nota" rows="3" maxlength="200" placeholder="¿Cómo te sentiste hoy?"></textarea>
                        </div>
                        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                            <button type="submit" id="btn-guardar" class="btn btn-primario">Guardar</button>
                            <button type="button" id="btn-cancelar" class="btn btn-borde" hidden>Cancelar edición</button>
                        </div>
                    </form>
                </aside>

                <div>
                    <h2 class="titulo-seccion">Mis registros</h2>
                    <div class="campo" style="margin-bottom: 1.5rem;">
                        <label for="busqueda">Buscar en mis registros</label>
                        <input type="search" id="busqueda" placeholder="Buscar por rutina o nota...">
                    </div>

                    <div id="mensaje-progreso" class="mensaje" role="status"></div>

                    <div id="lista-registros"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="contenedor">
            <p>&copy; 2026 FITPLAN. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script type="module" src="sesion.js"></script>
    <script type="module" src="progreso.js"></script>
</body>

</html>
