<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FITPLAN - Inicia sesión para acceder a tus rutinas.">
    <title>FITPLAN - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="contenedor header-inner">
            <a class="logo" href="index.html" aria-label="FitPlan, inicio">Fit<span>Plan</span></a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu"
                aria-label="Abrir o cerrar el menú"><span></span></button>
            <nav id="menu" aria-label="Principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="rutinas.html">Rutinas</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div id="zona-sesion" class="zona-sesion">
                <a class="btn btn-borde btn-sm" href="login.html">Iniciar sesión</a>
                <a class="btn btn-primario btn-sm" href="registro.html">Únete</a>
            </div>
        </div>
    </header>

    <main class="auth">
        <section class="auth-card">
            <h1>Iniciar sesión</h1>
            <p>
                Accede a tu cuenta para ver tus rutinas personalizadas y hacer seguimiento
                de tu progreso.
            </p>

            <form id="login-form" class="formulario" action="#" method="post">
                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                </div>
                <button type="submit" id="btn-login" class="btn btn-primario btn-bloque">Entrar</button>
            </form>

            <div class="separador" aria-hidden="true"><span>o</span></div>

            <button type="button" id="btn-google" class="btn btn-google">
                <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                Continuar con Google
            </button>

            <p id="mensaje-login" class="mensaje" role="status"></p>

            <p class="auth-pie">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="contenedor">
            <p>&copy; 2026 FITPLAN. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script type="module" src="sesion.js"></script>
    <script type="module">
        import { cliente, entrarConGoogle, entrarConCorreo } from './auth.js'

        const msg = document.getElementById('mensaje-login')

        function mostrar(texto, tipo) {
            msg.textContent = texto
            msg.className = 'mensaje ' + tipo
        }

        // Si ya hay sesión, no tiene sentido ver el login
        const { data } = await cliente.auth.getSession()
        if (data.session) location.replace('index.html')

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault()
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            mostrar('Entrando...', 'ok')
            try {
                await entrarConCorreo(email, password)
                location.href = 'index.html'
            } catch (error) {
                if (error.message.includes('Email not confirmed')) {
                    mostrar('Confirma tu correo antes de entrar. Revisa tu bandeja.', 'error')
                } else {
                    mostrar('Correo o contraseña incorrectos.', 'error')
                }
            }
        })

        document.getElementById('btn-google').addEventListener('click', async function () {
            mostrar('Abriendo Google...', 'ok')
            try {
                await entrarConGoogle()
            } catch (error) {
                mostrar('No se pudo iniciar con Google. Intenta de nuevo.', 'error')
            }
        })
    </script>
</body>

</html>
